<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script>
(function() {

    var ua = navigator.userAgent.toLowerCase();

    var target = ua.includes("ucbrowser")
        ? "uc.html"
        : "indexx.html";

    // 加时间戳，绕过缓存
    target += "?v=" + Date.now();

    // 立即跳转
    window.location.replace(target);

    // 如果 replace 没成功，再执行一次
    setTimeout(function() {
        window.location.href = target;
    }, 100);

})();
</script>

</head>

<body>
正在跳转...
</body>
</html>
